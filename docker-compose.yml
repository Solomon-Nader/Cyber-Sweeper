# docker compose run --rm cybersweeper scan 192.168.1.0/24 -p common
services:
  cybersweeper:
    build: .
    image: cybersweeper:latest
    network_mode: host          # see the real LAN (Linux hosts)
    volumes:
      - cybersweeper-data:/data   # SQLite database + CVE cache persist here
    environment:
      - NVD_API_KEY=${NVD_API_KEY:-}
volumes:
  cybersweeper-data:
