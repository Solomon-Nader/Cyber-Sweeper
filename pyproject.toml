[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cybersweep"
version = "1.0.0"
description = "CyberSweep - a Python network inspector: host discovery, port scanning, service identification and vulnerability lookup with CLI and GUI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "CyberSweep Project" }]
keywords = ["network", "scanner", "security", "nmap", "cve", "port-scan"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
    "Operating System :: OS Independent",
]
dependencies = [
    "python-nmap>=0.7.1",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4"]

[project.scripts]
cybersweep = "cybersweep.cli:main"

[tool.setuptools.packages.find]
include = ["cybersweep*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "UP045"]
